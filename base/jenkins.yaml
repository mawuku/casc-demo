jenkins:
  # systemMessage is set by child bundles (two bundles defining the same key = conflict)
  numExecutors: 0
  quietPeriod: 0
  markupFormatter:
    rawHtml:
      disableSyntaxHighlighting: false

unclassified:
  # Apply new bundle versions pushed to Git automatically (reload, no restart).
  # Inherited by every child bundle, e.g. demo-controller.
  bundleUpdateTiming:
    automaticReload: true
    automaticRestart: false
    rejectWarnings: false
    reloadAlwaysOnRestart: false
    skipNewVersions: false
