apiVersion: "1"
id: "demo-controller"
description: "Demo controller bundle - inherits from 'base'"
version: "13"          # bump on every change so the controller detects the update
parent: "base"
jcasc:
  - "jenkins.yaml"
  - "pipeline-demo-credentials.yaml"   # GitHub App (values from Kubernetes Secret)
  - "pipeline-demo-jenkins.yaml"     # pipeline best-practices demo: template catalog, discarder, explorer
plugins:
  - "pipeline-demo-plugins.yaml"     # pipeline best-practices demo (needs a controller restart)
catalog:
  - "pipeline-demo-plugin-catalog.yaml"   # allows non-CAP pipeline-utility-steps
items:
  - "items.yaml"
  - "pipeline-demo-items.yaml"       # pipeline best-practices demo jobs
variables:
  - "variables.yaml"
