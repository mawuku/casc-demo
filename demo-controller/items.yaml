removeStrategy:
  items: "none"
  rbac: "sync"

items:
  - kind: folder
    name: "casc-demo"
    displayName: "CasC Demo"
    description: "Folder and jobs created by the demo-controller CasC bundle"
    items:
      - kind: pipeline
        name: "hello-casc"
        displayName: "Hello CasC"
        description: "Runs on an ephemeral Kubernetes agent pod"
        definition:
          cpsFlowDefinition:
            sandbox: true
            script: |
              pipeline {
                agent {
                  kubernetes {
                    yaml '''
              apiVersion: v1
              kind: Pod
              spec:
                containers:
                - name: shell
                  image: public.ecr.aws/docker/library/busybox:1.36
                  command: ["sleep"]
                  args: ["infinity"]
              '''
                    defaultContainer 'shell'
                  }
                }
                stages {
                  stage('Hello') {
                    steps {
                      sh 'echo "This job, its folder and this controller were all created by CasC"'
                      sh 'uname -a'
                    }
                  }
                }
              }
