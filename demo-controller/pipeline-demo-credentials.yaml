# GitHub App credentials for org 'mawuku-pipeline-training-ws'. Values come from the Kubernetes Secret
# demo-controller-github-app, mounted at $SECRETS (see oc-bundle/items.yaml) - never from Git.
credentials:
  system:
    domainCredentials:
      - credentials:
          - gitHubApp:
              id: "gh-app"
              description: "GitHub App - mawuku-pipeline-training-ws"
              appID: "${GITHUB_APP_ID}"
              privateKey: "${GITHUB_APP_PRIVATE_KEY}"
              repositoryAccessStrategy: "inferOwner"
          - string:
              id: "gh-webhook-secret"
              description: "GitHub App webhook secret"
              scope: GLOBAL
              secret: "${GITHUB_WEBHOOK_SECRET}"
unclassified:
  gitHubPluginConfig:
    hookSecretConfigs:
      - credentialsId: "gh-webhook-secret"
