# 05-PTC-job-MB - Multibranch job instantiated from the Pipeline Template Catalog.
# Added LIVE in the demo (segment 3), once 'Pipeline Template Catalog Examples' has synced:
# add "pipeline-demo-items-ptc.yaml" to the items list in bundle.yaml, bump version, push.
# 'model' = <catalog folder id>/<template folder>. Verify the catalog id on your controller
# before the demo (see the runbook) - it is generated by CloudBees CI from the catalog name.
removeStrategy:          # required in every items file of a bundle
  # sync = top-level jobs/folders not declared in this bundle's items files are DELETED on the next apply
  items: "sync"
  rbac: "sync"

items:
- kind: cloudbeesTemplatedJob
  catalog: Pipeline Template Catalog Examples
  name: 05-PTC-job-MB
  model: Pipeline-Tem.c3qk18.log-Examples/1-helloWorld-MB
  attributes:
  - type: CREDENTIALS
    value: gh-app      # GitHub App credential
    key: githubToken
  - type: string
    value: sample-app-helloWorld
    key: repoName
  - type: string
    value: mawuku-pipeline-training-ws
    key: organisation
