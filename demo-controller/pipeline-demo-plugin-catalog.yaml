# Non-CAP (community) plugins for the pipeline best-practices demo.
# A plugin catalog only *allows* a plugin; it is installed because it is also listed in
# pipeline-demo-plugins.yaml. Transitive dependencies outside CAP must be added here too -
# the OC's bundle validation lists any that are missing.
type: "plugin-catalog"
version: "1"
name: "pipeline-demo-catalog"
displayName: "Pipeline best-practices demo - community plugins"
configurations:
  - description: "readYaml for the pipeline-training shared library"
    includePlugins:
      pipeline-utility-steps:
        version: "2.20.0"   # last release before the Jackson 3 switch (3.x needs non-CAP jackson3-api + its deps); no open security advisories
