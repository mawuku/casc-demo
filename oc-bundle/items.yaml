removeStrategy:
  items: "none"
  rbac: "sync"

items:
  - kind: managedController
    name: "demo-controller"
    displayName: "Demo Controller"
    description: "Managed controller created and configured entirely by CasC"
    properties:
      - configurationAsCode:
          bundle: "main/demo-controller"   # SCM bundle names are <branch>/<folder>
      - healthReporting:
          enabled: true
    configuration:
      kubernetes:
        memory: 3072
        cpus: 1.0
        disk: 10
        domain: "demo-controller"
        # Mount the GitHub App Secret; CasC resolves ${GITHUB_APP_ID} etc. from files in $SECRETS
        yaml: |-
          apiVersion: apps/v1
          kind: StatefulSet
          spec:
            template:
              spec:
                containers:
                - name: jenkins
                  env:
                  - name: SECRETS
                    value: /var/jenkins_casc_secrets
                  volumeMounts:
                  - name: github-app
                    mountPath: /var/jenkins_casc_secrets
                    readOnly: true
                volumes:
                - name: github-app
                  secret:
                    secretName: demo-controller-github-app
  # Quick test of cascAutoControllerProvisioning: created by CasC, started automatically by the OC.
  # Uses the 'base' bundle only (demo-controller's bundle needs the GitHub App Secret mount).
  - kind: managedController
    name: "test-controller"
    displayName: "Test Controller"
    description: "Auto-provisioning test - safe to delete"
    properties:
      - configurationAsCode:
          bundle: "main/base"
      - healthReporting:
          enabled: true
    configuration:
      kubernetes:
        memory: 3072
        cpus: 1.0
        disk: 10
        domain: "test-controller"
