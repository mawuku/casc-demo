# NOTE: this file lives in a PUBLIC repository. Never put secrets here.
# ${adminPassword}, ${ocUrl} and ${cascRepoUrl} are resolved from the Kubernetes Secret
# oc-casc-secrets, mounted into the OC pod (see helm/values.yaml.tpl).
jenkins:
  systemMessage: "Operations center configured by CloudBees Configuration as Code (oc-bundle, from Git)"
  numExecutors: 0
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Demo Admin"
          password: "${adminPassword}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

security:
  controllerExecutorCount:
    enforce:
      canOverride: false
      count: 0

cloudBeesCasCServer:
  visibility: true

masterprovisioning:
  kubernetes:
    cpus: "1"
    memory: 3072
    disk: 10

unclassified:
  location:
    url: "${ocUrl}"
  # Controller bundles (base, demo-controller) are pulled from this same Git repository.
  # Syntax taken from this OC's own CasC export (note: 'bundles' list and 'gitSource').
  bundleStorageService:
    activated: true
    bundles:
      - name: "SCM"
        retriever:
          SCM:
            ghChecksActivated: false
            scmSource:
              gitSource:
                remote: "${cascRepoUrl}"
                traits:
                  - "gitBranchDiscovery"
    checkOutTimeout: 600
    pollingPeriod: 60
    purgeOnDeactivation: false
  # New bundle versions pushed to Git are applied automatically (reload, no restart)
  bundleUpdateTiming:
    automaticReload: true
    automaticRestart: false
    rejectWarnings: false
    reloadAlwaysOnRestart: false
    skipNewVersions: false
