# NOTE: this file lives in a PUBLIC repository. Never put secrets here.
# ${adminPassword}, ${ocUrl} and ${cascRepoUrl} are resolved from the Kubernetes Secret
# oc-casc-secrets, mounted into the OC pod (see helm/values.yaml.tpl).
jenkins:
  systemMessage: "Operations center configured by CloudBees Configuration as Code (oc-bundle, from Git)"
  numExecutors: 0
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Demo Admin"
          password: "${adminPassword}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

security:
  controllerExecutorCount:
    enforce:
      canOverride: false
      count: 0

cloudBeesCasCServer:
  visibility: true

masterprovisioning:
  kubernetes:
    cpus: "1"
    memory: 3072
    disk: 10

unclassified:
  location:
    url: "${ocUrl}"
  # Controller bundle location (Git) is added in step 2 of the README "Git bundle location"
  # section, once the git plugin from plugins.yaml is installed on the OC.
